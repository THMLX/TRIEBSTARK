server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep directory redirects compatible with Hyperlift's HTTPS proxy.
    absolute_redirect off;
    server_tokens off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        # Revalidate pages so published updates are available immediately.
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        # Asset names are not fingerprinted; avoid a long immutable cache.
        expires 1h;
    }

    location = /404.html {
        internal;
        expires -1;
    }
}
